name: Xenofilx Note 4 Parameter Grid

# Reproduces Supplementary Table S7: the 4x3 factorial audit of mismatch threshold
# (5-8) against unmapped-read penalty (8-12) on the matched 60% human BS-seq mixtures
# (n=3 replicates, 36 evaluation runs).
#
# Scope policy:
#   push / pull_request      -> replicate 1 only (12 runs) as a fast gate
#   workflow_dispatch (full) -> all three replicates (36 runs), sharded per replicate
#
# Three arms are evaluated for every combination: modern `xenofilx` (strand-aware bisulfite NM),
# the `xdxtools` prototype (Picard `SetNmMdAndUqTags` with `IS_BISULFITE_SEQUENCE=true` + R
# `XenofilteR`), and the unpatched conventional control, which is the same pipeline with the
# bisulfite flag omitted. The control is what shows the patch is load-bearing.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full_sweep:
        description: 'Run all three replicates instead of replicate 1 only'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FIXTURE_BASE_URL: https://huggingface.co/datasets/fallingstar10/otter-data/resolve/0b0c627cb0fdb2394577bb9c6cdc969646ed668f
  ENVA_COMMIT: 3559ddf7a5b46d3aee78c0f1a6222850ecbc8fa7
  XENOFILTER_COMMIT: de0bbe4c706766702b0fe15a676893639f96d50d
  HG19_URL: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_19/GRCh37.p13.genome.fa.gz
  HG19_FA_SHA256: b22e74cdd8b90a1228474ce31739aa76d71be55735f93de1471e3886790b9256
  HG19_FA_SIZE: '3234842113'
  MM10_URL: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/GRCm38.primary_assembly.genome.fa.gz
  MM10_FA_SHA256: 767f48e8ae5bda117ad519fb694cbf7e24f161bf094c274bbbcd16e52aedf802
  MM10_FA_SIZE: '2776387546'

# A push to the same ref supersedes any run still in flight for this workflow. The group is
# per workflow and per ref, so the newest commit is always fully covered and other branches
# are untouched. Kept in sync across the repository's workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan the replicate scope
    runs-on: ubuntu-latest
    outputs:
      replicates: ${{ steps.scope.outputs.replicates }}
    steps:
      - name: Checkout xenofilx
        uses: actions/checkout@v4

      - name: Resolve the requested replicate scope
        id: scope
        env:
          FULL_SWEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sweep || 'false' }}
        run: |
          set -euo pipefail
          if [ "$FULL_SWEEP" = "true" ]; then
            echo 'replicates=[1, 2, 3]' >> "$GITHUB_OUTPUT"
          else
            echo 'replicates=[1]' >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" = "success" ]; then gate_result="PASS"; else gate_result="-"; fi
          bash scripts/ci/job-summary.sh \
            --verdict "${{ job.status }}" \
            --title "Xenofilx Note 4 — parameter grid scope planning" \
            --checked "Decides which 60% human replicates the Table S7 grid evaluates and publishes the replicate list for the matrix job." \
            --check "Replicate scope resolved|replicate list emitted|see step log|${gate_result}" \
            --metric "Trigger|${{ github.event_name }}" \
            --metric "Full sweep requested|${{ github.event_name == 'workflow_dispatch' && inputs.full_sweep || 'false' }}" \
            --limit "Planning only: no evaluation run happens here. A push audits replicate 1 (12 runs); workflow_dispatch with full_sweep covers all three replicates (36 runs)." \
            --note "The 4x3 threshold/penalty combinations are enumerated inside the matrix job, not here."

  parameter-grid:
    name: Grid replicate ${{ matrix.replicate }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        replicate: ${{ fromJSON(needs.plan.outputs.replicates) }}
    steps:
      - name: Checkout xenofilx
        uses: actions/checkout@v4

      - name: Checkout pinned enva
        uses: actions/checkout@v4
        with:
          repository: otterlab-bio/enva
          ref: ${{ env.ENVA_COMMIT }}
          path: .ci/enva

      - name: Checkout pinned XenofilteR source
        uses: actions/checkout@v4
        with:
          repository: PeeperLab/XenofilteR
          ref: ${{ env.XENOFILTER_COMMIT }}
          path: .ci/XenofilteR

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare evidence directory
        run: mkdir -p ci-artifacts/{reference,evidence,logs,fixture-cache}

      - name: Build xenofilx and enva
        run: |
          set -euo pipefail
          go build -buildvcs=false -o ci-artifacts/xenofilx ./cmd/xenofilx
          (cd .ci/enva && cargo build --release --locked --bin enva) 2>&1 | tee ci-artifacts/logs/enva-build.log

      - name: Create the analysis environment through enva
        env:
          RATTLER_CACHE_DIR: ${{ runner.temp }}/rattler-cache
        run: |
          set -euo pipefail
          mkdir -p "$RATTLER_CACHE_DIR"
          cat > ci-artifacts/grid-analysis.yaml <<'YAML'
          channels:
            - conda-forge
            - bioconda
          dependencies:
            - samtools=1.15.1
            - picard=3.4.0
            - r-base=4.3
            - bioconductor-biocparallel
            - bioconductor-genomicalignments
            - bioconductor-genomeinfodbdata
            - bioconductor-genomicranges
            - bioconductor-iranges
            - bioconductor-s4vectors
            - bioconductor-rsamtools
            - r-futile.logger
            - r-jsonlite
          YAML
          .ci/enva/target/release/enva create \
            --yaml ci-artifacts/grid-analysis.yaml \
            --name grid-analysis \
            --force \
            --output summary \
            2>&1 | tee ci-artifacts/logs/enva-create.log

      - name: Install XenofilteR from the pinned source
        run: |
          set -euo pipefail
          bash scripts/gate6/install-xenofilter.sh \
            "$GITHUB_WORKSPACE/.ci/XenofilteR" \
            grid-analysis \
            2>&1 | tee ci-artifacts/logs/xenofilter-install.log

      - name: Acquire and verify reference FASTAs
        run: |
          set -euo pipefail
          fetch_reference () {
            local label="$1" url="$2" fa_sha="$3" fa_size="$4"
            curl --fail --location --silent --show-error --retry 5 "$url" \
              | gunzip -c > "ci-artifacts/reference/${label}.fa"
            printf '%s  %s\n' "$fa_sha" "ci-artifacts/reference/${label}.fa" | sha256sum --check -
            test "$(stat -c %s "ci-artifacts/reference/${label}.fa")" = "$fa_size"
          }
          fetch_reference hg19 "$HG19_URL" "$HG19_FA_SHA256" "$HG19_FA_SIZE"
          fetch_reference mm10 "$MM10_URL" "$MM10_FA_SHA256" "$MM10_FA_SIZE"

      - name: Sweep the 4x3 parameter grid
        run: |
          set -euo pipefail
          for threshold in 5 6 7 8; do
            for penalty in 8 10 12; do
              cell="human0p6-replicate${{ matrix.replicate }}"
              python3 scripts/gate6/run-note4-gradient-cell.py \
                --contract benchmark/note4/mixture-cells.json \
                --cell "$cell" \
                --fixture-base-url "$FIXTURE_BASE_URL" \
                --reference-directory ci-artifacts/reference \
                --xenofilx ci-artifacts/xenofilx \
                --enva .ci/enva/target/release/enva \
                --environment grid-analysis \
                --work-directory ci-artifacts/evidence \
                --mm-threshold "$threshold" \
                --unmapped-penalty "$penalty" \
                2>&1 | tee "ci-artifacts/logs/${cell}-t${threshold}-p${penalty}.log"
            done
          done

      - name: Compare the grid with the recorded per-cell metrics
        run: |
          set -euo pipefail
          # The same comparator the Table S6 gradient uses. It writes the per-cell comparison
          # report the briefing reads, so the summary can state the measured recall instead of
          # only counting how many metrics were compared. Recorded values are the reference,
          # not a gate: differences are reported and the evidence is kept either way.
          python3 scripts/gate6/compare-note4-gradient.py \
            --metrics-directory ci-artifacts/evidence \
            --expected benchmark/note4/per-cell-expected-s7.json \
            --report ci-artifacts/grid-comparison.json \
            2>&1 | tee ci-artifacts/logs/grid-comparison.log

      - name: Upload parameter grid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xenofilx-note4-parameter-grid-replicate-${{ matrix.replicate }}
          path: |
            ci-artifacts/evidence/
            ci-artifacts/logs/
            ci-artifacts/grid-comparison.json
          if-no-files-found: warn
          retention-days: 90

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          bash scripts/ci/summary-field.sh \
            ci-artifacts/grid-comparison.json#evaluated_cell_count \
            ci-artifacts/grid-comparison.json#metric_outcomes.within_range \
            ci-artifacts/grid-comparison.json#metric_outcomes.deviation \
            ci-artifacts/grid-comparison.json#metric_outcomes.large_deviation \
            ci-artifacts/grid-comparison.json#tolerance_percentage_points \
            > ci-artifacts/summary-fields.txt 2>/dev/null || true
          field() { rg -N "^$1=" ci-artifacts/summary-fields.txt 2>/dev/null | head -n 1 | cut -d= -f2- || echo "-"; }
          evaluated="$(find ci-artifacts/evidence -name source-performance.json 2>/dev/null | wc -l | tr -d ' ')"
          # One row per threshold/penalty combination carrying the measured graft recall and
          # host specificity against the recorded value. The values are read from the comparison
          # report, not scraped from the step log, which holds prose rather than numbers.
          declare -a comparison_rows=()
          while IFS= read -r row; do
            [ -n "${row}" ] && comparison_rows+=(--check "${row}")
          done < <(python3 scripts/gate6/note4-briefing-rows.py \
            --report ci-artifacts/grid-comparison.json \
            --metrics modern_recall legacy_recall modern_spec legacy_spec 2>/dev/null || true)
          # The unpatched control is a negative control, not a reported arm: it has no recorded
          # per-cell expectation, so these rows carry measured values only. Graft recall and PPV
          # collapse to ~0 pp while host specificity is unaffected.
          declare -a control_rows=()
          while IFS= read -r row; do
            [ -n "${row}" ] && control_rows+=(--check "${row}")
          done < <(python3 scripts/gate6/note4-briefing-rows.py \
            --report ci-artifacts/grid-comparison.json \
            --metrics conventional_recall conventional_spec conventional_ppv \
            --label-suffix " (unpatched control)" 2>/dev/null || true)
          if [ "${{ job.status }}" = "success" ]; then gate_result="PASS"; else gate_result="-"; fi
          bash scripts/ci/job-summary.sh \
            --verdict "${{ job.status }}" \
            --title "Xenofilx Note 4 — parameter grid (Table S7)" \
            --scope "replicate ${{ matrix.replicate }}" \
            --checked "Sweeps the 4x3 factorial of mismatch threshold {5,6,7,8} against unmapped penalty {8,10,12} on the matched 60% human mixtures, evaluating three arms for every combination: modern xenofilx, the legacy Picard plus XenofilteR prototype, and the unpatched conventional control. Each row reports measured graft recall and host specificity, beside the recorded value for the two reported arms." \
            --check "Combinations evaluated|all 12|${evaluated} produced source-performance.json|${gate_result}" \
            --check "Combinations compared by the report|all evaluated|$(field evaluated_cell_count)|-" \
            --check "Metrics at tolerance $(field tolerance_percentage_points) pp|reported, never enforced|within $(field within_range), deviation $(field deviation), large $(field large_deviation)|-" \
            "${comparison_rows[@]}" \
            "${control_rows[@]}" \
            --metric "Evaluations per replicate|12 (4 thresholds x 3 penalties)" \
            --metric "Decision parameters swept|threshold 5-8, penalty 8-12" \
            --metric "Fixture revision|0b0c627c (immutable)" \
            --artifact "xenofilx-note4-parameter-grid-replicate-${{ matrix.replicate }}" \
            --limit "Recall and specificity differences are reported rather than enforced, exactly as for the gradient: a single replicate can deviate from the published three-replicate mean, so the spread is recorded and the evidence kept. Only a missing or structurally invalid evidence set fails the job." \
            --limit "The unpatched control has no recorded per-cell expectation, so its rows state measured values and are marked as outside the recorded contract rather than compared against it. It is reported because its collapse is the evidence that the bisulfite NM recalculation is load-bearing, and it stays out of the Table S7 numbers." \
            --note "All three arms run for every combination, so the grid reports the same three-arm comparison as the gradient."
